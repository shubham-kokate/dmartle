<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dmartle: guess the DMart price</title>
<meta name="description" content="A daily game where you guess the price of everyday DMart products.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="top"><h1>dmartle</h1><small id="mode"></small></div>
  <section class="tag" aria-live="polite">
    <div class="emoji" id="emoji"></div>
    <div class="name" id="name"></div>
    <div class="pack" id="pack"></div>
    <div class="price hide" id="price"></div>
  </section>
  <div class="bill" id="bill"></div>
  <div class="left" id="left"></div>
  <div class="in" id="entry">
    <span>₹</span>
    <input id="guess" type="number" inputmode="decimal" min="1" placeholder="Your guess" aria-label="Your price guess in rupees">
    <button id="go">Guess</button>
  </div>
  <div class="end hide" id="end">
    <h2 id="endTitle"></h2>
    <div id="endSub"></div>
    <div class="btns">
      <button id="share">Copy result</button>
      <button class="alt" id="again">Play another</button>
    </div>
  </div>
  <p class="note">Guess within 5% of the shelf price to win. You get 6 tries. Prices are approximate and can differ by city and store, so edit js/items.js to match your local DMart.</p>
</main>
<script src="js/items.js"></script>
<script src="js/app.js"></script>
</body>
</html>
